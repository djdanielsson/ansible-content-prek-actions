---
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Check for releasable changes and calculate release tag
        id: release_info
        run: |
          git fetch --tags origin
          python scripts/release_metadata.py >> "$GITHUB_OUTPUT"

      - name: Sync hooks and README versions from pyproject.toml
        if: steps.release_info.outputs.release == 'true'
        run: python scripts/sync_hooks.py --release-tag "${{ steps.release_info.outputs.tag }}"

      - name: Commit hook sync changes (if any)
        if: steps.release_info.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .pre-commit-hooks.yaml README.md
          if ! git diff --cached --quiet; then
            git commit -m "deps: sync hooks and README versions from pyproject.toml"
            git push origin HEAD:main
          fi

      - name: Create tag and release
        if: steps.release_info.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release_info.outputs.tag }}"
          adt_version="${{ steps.release_info.outputs.adt_version }}"

          git tag "${tag}"
          git push origin "${tag}"

          gh release create "${tag}" \
            --title "${tag}" \
            --notes "$(cat <<EOF
          Pinned to [ansible-dev-tools v${adt_version}](https://pypi.org/project/ansible-dev-tools/${adt_version}/).

          ## Dependency versions

          \`\`\`
          $(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          for group, deps in data['project']['optional-dependencies'].items():
              print(f'  [{group}]')
              for dep in deps:
                  print(f'    {dep}')
          ")
          \`\`\`

          ## Usage

          \`\`\`yaml
          repos:
            - repo: https://github.com/${{ github.repository }}
              rev: ${tag}
              hooks:
                - id: ansible-lint
                - id: changelog
                - id: galaxy-importer
          \`\`\`
          EOF
          )"
